[supervisord]
nodaemon=true
# Send supervisord's own log to the container's stdout so `docker logs` shows it.
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

# Each program's stdout/stderr is redirected to the container's stdout/stderr
# (PID 1 is supervisord, so /dev/stdout and /dev/stderr resolve to the container
# log streams). _maxbytes=0 disables rotation, which is required for /dev/* paths.
# Result: `docker logs <container>` shows interleaved output from all three apps.

# pb-entrypoint.sh runs an idempotent `superuser upsert` when POCKETBASE_ADMIN_EMAIL
# / POCKETBASE_ADMIN_PASSWORD are present in the container env, then execs the serve
# below. With no creds set it skips straight to serve (setup URL on first boot).
# The admin creds are inherited from supervisord's environment (the container env),
# so passing them at `docker run -e ...` is all that's needed.
[program:pocketbase]
command=/app/pb/pb-entrypoint.sh --http=0.0.0.0:8090 --dir=/data/pb_data --hooksDir=/app/pb/pb_hooks --migrationsDir=/app/pb/pb_migrations
directory=/app/pb
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=nextjs
environment=HOME="/app",USER="nextjs"
priority=10

[program:nextjs]
command=yarn workspace @project/webapp start
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=nextjs
environment=HOME="/app",USER="nextjs",NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0"
# Wait a bit for PocketBase to start
startsecs=5
startretries=3
priority=20

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=root
priority=30

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
